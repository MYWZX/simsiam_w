seed: 123
split_seed: 42
results_csv: ./outputs/all_results_agiqa3k_error_aware_fusion_gate.csv
output_dir: ./outputs/agiqa3k_error_aware_fusion_gate_seed123
dataset:
  type: agiqa3k_simsiam
  root_dir: ./data/AGIQA-3K
  image_dir: image
  csv_file: data.csv
  input_size: 224
  mos_max: 5.0
  final_quality_weight: 0.5
  final_align_weight: 0.5
  use_full_prompt: true
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  verify_images: false
  use_perturb: true
  perturbation_prob: 0.7
  perturbation_strengths:
  - mild
  - moderate
  perturbation_strength: mild
  saliency_sampling_ratio: 0.7
loader:
  batch_size: 8
  num_workers: 4
  pin_memory: true
model:
  global_encoder:
    type: open_clip
    model_name: ViT-B-16
    open_clip_pretrained: openai
    pretrained: true
    freeze: false
    output_dim: 512
    source_normalization: imagenet
    normalize_output: true
  local_encoder:
    type: resnet50.a1_in1k
    pretrained: true
    freeze: false
    output_dim: 256
  fusion:
    embed_dim: 256
    num_heads: 4
    dropout: 0.15
  heads:
    mlp_hidden_dim: 256
    dropout: 0.2
  text_encoder:
    clip_model_name: ViT-B-16
    clip_pretrained: openai
  nss_text_gate:
    nss_dim: 6
    gate_hidden_dim: 256
    quality_mix_init: 0.0
  align_gate:
    gate_hidden_dim: 256
  fusion_init_logit: 0.0
  fusion_gate:
    enabled: true
    hidden_dim: 32
    dropout: 0.10
    input_mode: scores
    detach_inputs: true
  align_adapter:
    enabled: false
  align_vmamba:
    enabled: false
train:
  epochs: 60
  lr: 0.0001
  weight_decay: 0.002
  amp: true
  grad_clip: 1.0
  log_interval: 20
  early_stop_patience: 20
  pretrained_checkpoint: outputs/richhf18k_cm_pretrain_cleanview_component_anchor_component_loss_reweighting/best_artifact_anchor_pretrain.pth
  pretrained_load_scope: representation
  layerwise_lr:
    enabled: true
    global_encoder_mult: 0.02
    local_encoder_mult: 0.02
    fusion_mult: 0.1
    fusion_gate_mult: 1.0
    quality_mult: 1.0
    align_mult: 1.0
    other_mult: 1.0
  lambda_quality: 1.0
  lambda_align: 1.0
  lambda_final: 1.0
  # MOS-error-aware supervision for the sample-adaptive final fusion.
  lambda_fusion_gate: 0.1
  fusion_gate_tau: 0.05
  fusion_gate_start_epoch: 0
  lambda_align_aux: 0.3
  lambda_pert: 0.02
  pert_margin: 0.07
  lambda_rank_quality: 0.03
  lambda_rank_align: 0.03
  lambda_rank_final: 0.05
  rank_margin: 0.02
  lambda_neg: 0.05
  neg_margin: 0.1
  use_align_rank: false
  lambda_align_rank: 0.05
  align_rank_margin_pos_hard: 0.05
  align_rank_margin_hard_neg: 0.05
  hard_negative_topk: 5
  lambda_srocc_quality: 0.02
  lambda_srocc_align: 0.04
  lambda_srocc_final: 0.03
  srocc_tau: 0.02
  use_hard_rank: true
  hard_rank_ratio: 0.35
  selection_metric: val_SROCC
  selection_mode: max
optimizer:
  type: adamw
scheduler:
  type: cosine
  min_lr: 1.0e-06
