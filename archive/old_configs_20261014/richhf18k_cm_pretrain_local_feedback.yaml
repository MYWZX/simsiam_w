seed: 42
results_csv: ./outputs/all_results_richhf_local_feedback_layerwise.csv
output_dir: ./outputs/richhf18k_cm_pretrain_local_feedback_layerwise

dataset:
  type: mixed_pretrain
  input_size: 224
  split_strategy: official

  datasets:
    - name: richhf18k
      type: richhf18k
      root_dir: ./data/RichHF-18K/processed
      split_strategy: official
      csv_file: "{split}_with_answer_confidence.csv"
      image_name_column: name
      image_path_column: image_path
      prompt_column: prompt
      answer_column: answer
      status_column: answer_status
      answer_confidence_column: answer_confidence

      quality_score_mode: weighted_components
      artifact_score_column: artifact_score
      aesthetics_score_column: aesthetics_score
      quality_artifact_weight: 0.5
      quality_aesthetics_weight: 0.5
      align_score_column: align_score
      rank_target_column: overall_score

      # RichHF human spatial and delimiter-level word annotations.
      use_local_feedback: true
      misalignment_map_path_column: misalignment_map_path
      misalignment_map_dir: "{split}/misalignment_maps"
      prompt_misalignment_label_column: prompt_misalignment_label

      only_ok_answer: true
      skip_missing_images: true
      filter_low_confidence_answer: false
      answer_confidence_default: 0.0
      answer_confidence_min: 0.20
      align_weight_mode: human_align
      answer_weight_mode: answer_confidence
      prompt_answer_weight_mode: align_confidence
      use_prompt_answer_gap: true
      sampling_weight: 1.0

loader:
  batch_size: 8
  num_workers: 4
  pin_memory: true

model:
  global_encoder:
    type: vit_base_patch16_224.augreg2_in21k_ft_in1k
    pretrained: true
    freeze: false
    output_dim: 768
  local_encoder:
    type: resnet50.a1_in1k
    pretrained: true
    freeze: false
    output_dim: 256
  fusion:
    embed_dim: 256
    num_heads: 4
    dropout: 0.15
  heads:
    mlp_hidden_dim: 256
    dropout: 0.2
  text_encoder:
    clip_model_name: ViT-B-16
    clip_pretrained: openai
  nss_text_gate:
    nss_dim: 6
    gate_hidden_dim: 256
    quality_mix_init: 0.0
  align_gate:
    gate_hidden_dim: 256
  fusion_init_logit: 0.0
  align_adapter:
    enabled: false
  align_vmamba:
    enabled: false
  simsiam:
    proj_dim: 256
    proj_hidden_dim: 512
    pred_hidden_dim: 128

train:
  epochs: 50
  lr: 2.0e-5
  weight_decay: 1.0e-3
  amp: true
  grad_clip: 1.0
  log_interval: 20
  early_stop_patience: 15

  use_joint_iqa_pretraining: true
  use_dual_proxy_supervision: false

  # Preserve pretrained visual features while allowing newly initialized
  # projection and prediction heads to adapt quickly to RichHF supervision.
  # The values below multiply train.lr (2e-5).
  layerwise_lr:
    enabled: true
    global_encoder_mult: 0.10      # ViT: 2e-6
    local_encoder_mult: 0.10       # ResNet-50: 2e-6
    fusion_mult: 0.50              # semantic-structure fusion: 1e-5
    shared_projection_mult: 0.50   # text_to_fused: 1e-5
    align_feature_mult: 1.00       # align feature projections/adapters: 2e-5
    iqa_head_mult: 5.00            # persistent Quality/Align/Final heads: 1e-4
    simsiam_head_mult: 5.00        # disposable projectors/predictors: 1e-4
    other_mult: 1.00

  lambda_img_siam: 0.15
  lambda_img_answer: 0.20
  lambda_img_prompt: 0.25
  lambda_prompt_answer: 0.05
  # Replaced by explicit RichHF word-level pull/push below in this experiment.
  lambda_prompt_answer_gap: 0.0
  prompt_answer_gap_max_similarity: 0.20

  lambda_quality_reg: 0.20
  lambda_quality_rank: 0.10
  lambda_quality_srocc: 0.02
  quality_rank_margin: 0.05
  quality_srocc_tau: 0.02

  lambda_align_pretrain_reg: 0.20
  lambda_align_pretrain_rank: 0.10
  lambda_align_pretrain_srocc: 0.02
  align_rank_margin: 0.05
  align_srocc_tau: 0.02

  lambda_final_pretrain_reg: 0.20
  lambda_final_pretrain_rank: 0.10
  lambda_final_pretrain_srocc: 0.02
  final_rank_margin: 0.05
  final_srocc_tau: 0.02

  # RichHF labels directly refine two SimSiam relations; no extra regression head.
  # Image-Prompt: aligned patches pull closer, misaligned patches push apart.
  lambda_img_prompt_local: 0.05
  img_prompt_misaligned_max_similarity: 0.10
  misalignment_map_active_threshold: 0.05
  # Prompt-Answer: Answer pulls toward aligned words and away from misaligned words.
  lambda_prompt_answer_word: 0.05
  prompt_answer_misaligned_max_similarity: 0.10

  lambda_rank: 0.0
  lambda_pretrain_srocc: 0.0
  pretrain_use_hard_rank: false
  pretrain_selection_metric: val_joint_SROCC
  pretrain_selection_mode: max

optimizer:
  type: adamw

scheduler:
  type: cosine
  min_lr: 1.0e-6

run_id: richhf18k_pretrain_local_feedback_layerwise
