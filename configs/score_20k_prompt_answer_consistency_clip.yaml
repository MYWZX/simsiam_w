prompt_answer_consistency_score:
  # Method: CLIP text-text cosine similarity between original prompt and Qwen answer.
  # This is weak supervision used only for filtering/weighting prompt-answer SimSiam.
  clip_model_name: ViT-B-16
  clip_pretrained: openai
  device: cuda
  batch_size: 256
  save_every: 1000

  input_csv: ./data/AIGIQA-20K/info_merge_with_answer_pseudo_align.csv
  output_csv: ./data/AIGIQA-20K/info_merge_with_answer_pseudo_align_pa.csv

  input_encoding: auto
  output_encoding: utf-8-sig

  prompt_column: prompt
  answer_column: answer
  answer_status_column: answer_status
  only_ok_answer: true

  raw_score_column: prompt_answer_raw
  score_column: prompt_answer_score
  status_column: prompt_answer_status
  error_column: prompt_answer_error

  # percentile is preferred because text-text cosine scores occupy a narrow range.
  normalize_mode: percentile
  normalize_q_low: 0.05
  normalize_q_high: 0.95
