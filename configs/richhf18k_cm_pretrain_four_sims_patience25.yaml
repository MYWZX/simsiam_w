seed: 42
results_csv: ./outputs/all_results_richhf18k.csv
output_dir: ./outputs/richhf18k_cm_pretrain_four_sims_patience25

dataset:
  type: mixed_pretrain
  input_size: 224
  split_strategy: official

  datasets:
    - name: richhf18k
      type: richhf18k
      root_dir: ./data/RichHF-18K/processed
      split_strategy: official
      csv_file: "{split}_with_answer_confidence.csv"
      image_name_column: name
      image_path_column: image_path
      prompt_column: prompt
      answer_column: answer
      status_column: answer_status
      answer_confidence_column: answer_confidence

      # RichHF scores are in [0, 1] and higher-is-better.
      quality_score_column: quality_score
      align_score_column: align_score
      rank_target_column: overall_score

      only_ok_answer: true
      skip_missing_images: true
      filter_low_confidence_answer: false
      answer_confidence_default: 0.0
      answer_confidence_min: 0.20

      align_weight_mode: human_align
      answer_weight_mode: answer_confidence
      prompt_answer_weight_mode: align_confidence
      use_prompt_answer_gap: true
      sampling_weight: 1.0

loader:
  batch_size: 8
  num_workers: 4
  pin_memory: true

model:
  global_encoder:
    type: vit_base_patch16_224.augreg2_in21k_ft_in1k
    pretrained: true
    freeze: false
    output_dim: 768

  local_encoder:
    type: resnet50.a1_in1k
    pretrained: true
    freeze: false
    output_dim: 256

  fusion:
    embed_dim: 256
    num_heads: 4
    dropout: 0.15

  heads:
    mlp_hidden_dim: 256
    dropout: 0.2

  text_encoder:
    clip_model_name: ViT-B-16
    clip_pretrained: openai

  simsiam:
    proj_dim: 256
    proj_hidden_dim: 512
    pred_hidden_dim: 128

train:
  epochs: 40
  lr: 2.0e-5
  weight_decay: 1.0e-3
  amp: true
  grad_clip: 1.0
  log_interval: 20
  early_stop_patience: 25

  # Four relational SimSiam losses.
  lambda_img_siam: 0.15
  lambda_img_answer: 0.20
  lambda_img_prompt: 0.25
  lambda_prompt_answer: 0.05
  lambda_prompt_answer_gap: 0.02
  prompt_answer_gap_max_similarity: 0.20

  # RichHF overall_score supervises ranking of the pretraining proxy.
  lambda_rank: 0.10
  rank_margin: 0.05
  lambda_pretrain_srocc: 0.02
  pretrain_srocc_tau: 0.02
  pretrain_selection_metric: val_proxy_SROCC
  pretrain_selection_mode: max

optimizer:
  type: adamw

scheduler:
  type: cosine
  min_lr: 1.0e-6

run_id: richhf18k_pretrain_four_sims_patience25
