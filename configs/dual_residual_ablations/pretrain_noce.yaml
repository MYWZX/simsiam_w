seed: 42
split_seed: 42
results_csv: outputs/all_results_richhf18k_cliplarge_dualquality_residual_layer3_noce_seed42.csv
output_dir: outputs/richhf18k_cliplarge_dualquality_residual_layer3_noce_seed42
dataset:
  type: mixed_pretrain
  input_size: 224
  split_strategy: official
  datasets:
  - name: richhf18k
    type: richhf18k
    root_dir: ./data/RichHF-18K/processed
    split_strategy: official
    csv_file: '{split}_with_answer_confidence.csv'
    image_name_column: name
    image_path_column: image_path
    prompt_column: prompt
    answer_column: answer
    status_column: answer_status
    answer_confidence_column: answer_confidence
    quality_score_mode: weighted_components
    artifact_score_column: artifact_score
    aesthetics_score_column: aesthetics_score
    quality_artifact_weight: 0.5
    quality_aesthetics_weight: 0.5
    align_score_column: align_score
    rank_target_column: overall_score
    use_local_feedback: true
    misalignment_map_path_column: misalignment_map_path
    misalignment_map_dir: '{split}/misalignment_maps'
    prompt_misalignment_label_column: prompt_misalignment_label
    only_ok_answer: true
    skip_missing_images: true
    filter_low_confidence_answer: false
    answer_confidence_default: 0.0
    answer_confidence_min: 0.2
    align_weight_mode: human_align
    answer_weight_mode: answer_confidence
    prompt_answer_weight_mode: align_confidence
    use_prompt_answer_gap: true
    sampling_weight: 1.0
loader:
  batch_size: 8
  num_workers: 4
  pin_memory: true
model:
  global_encoder:
    type: open_clip
    model_name: ViT-B-16
    open_clip_pretrained: openai
    pretrained: true
    freeze: false
    output_dim: 512
    source_normalization: imagenet
    normalize_output: true
  local_encoder:
    feature_stage: layer3
    type: resnet50.a1_in1k
    pretrained: true
    freeze: false
    output_dim: 256
  fusion:
    embed_dim: 256
    num_heads: 4
    dropout: 0.15
  heads:
    mlp_hidden_dim: 256
    dropout: 0.2
  text_encoder:
    clip_model_name: ViT-B-16
    clip_pretrained: openai
  nss_text_gate:
    nss_dim: 6
    gate_hidden_dim: 256
    quality_mix_init: 0.0
  align_gate:
    gate_hidden_dim: 256
  fusion_init_logit: 0.0
  quality_branch_use_text_gate: false
  quality_adapter:
    enabled: true
    hidden_dim: 512
    output_dim: 256
    dropout: 0.1
    last_bn: true
    normalize: true
    mode: residual_feature
    residual_init: 0.1
  align_adapter:
    enabled: true
    adapt_text: true
    hidden_dim: 256
    dropout: 0.1
    residual_scale: 0.1
  align_vmamba:
    enabled: false
  quality_auxiliary_heads:
    enabled: true
    components:
    - artifact
    - aesthetics
    hidden_dim: 256
    dropout: 0.2
  simsiam:
    proj_dim: 256
    proj_hidden_dim: 512
    pred_hidden_dim: 128
    separate_quality_projection: true
  dual_quality_representation:
    enabled: true
    hidden_dim: 256
    dropout: 0.1
    feature_local_init: 0.5
  quality_text_bank:
    enabled: false
    score_blend: 0.0
    temperature: 0.2
    class_context_tokens: 4
    centers:
    - 0.375
    - 0.54166667
    - 0.66666669
    - 0.79166666
    - 0.95833334
  quality_global_feature: g
train:
  epochs: 50
  lr: 2.0e-05
  weight_decay: 0.001
  amp: true
  grad_clip: 1.0
  log_interval: 20
  early_stop_patience: 15
  use_joint_iqa_pretraining: true
  two_output_only: true
  human_supervision_view: three_view
  quality_supervision_target: quality_score
  use_dual_proxy_supervision: false
  pcgrad:
    enabled: true
  mirror_augmentation:
    enabled: false
    probability: 0.5
    directional_only: true
    swap_text: true
    disable_random_horizontal_flip: true
  quality_auxiliary_supervision:
    enabled: true
    components:
      artifact:
        target_key: artifact_score
        weight_key: artifact_weight
        lambda_reg: 0.05
        lambda_rank: 0.025
        lambda_srocc: 0.0
        rank_margin: 0.05
        required: false
      aesthetics:
        target_key: aesthetics_score
        weight_key: aesthetics_weight
        lambda_reg: 0.05
        lambda_rank: 0.025
        lambda_srocc: 0.0
        rank_margin: 0.05
        required: false
  quality_anchor_ordinal:
    enabled: false
  quality_balanced_sampling:
    enabled: false
    bin_edges:
    - 0.0
    - 0.5
    - 0.6
    - 0.7
    - 0.85
    - 1.000001
    weight_power: 0.5
    min_weight: 0.5
    max_weight: 3.0
    balance_strength: 1.0
  quality_loss_reweighting:
    enabled: false
    bin_edges:
    - 0.0
    - 0.5
    - 0.6
    - 0.7
    - 0.85
    - 1.000001
    weight_power: 0.5
    min_weight: 0.5
    max_weight: 3.0
    balance_strength: 0.3
  quality_component_anchor_ordinal:
    enabled: true
    num_levels: 5
    anchor_temperature: 0.2
    anchor_arc_degrees: 90.0
    artifact:
      centers:
      - 0.41666667
      - 0.58333333
      - 0.66666669
      - 0.75
      - 0.91666669
      basis_frequency: 1
    aesthetics:
      centers:
      - 0.5
      - 0.58333333
      - 0.66666669
      - 0.75
      - 0.91666669
      basis_frequency: 2
  mean_residual_quality:
    enabled: false
  quality_relation_siam:
    enabled: false
  layerwise_lr:
    enabled: true
    global_encoder_mult: 0.1
    local_encoder_mult: 0.1
    fusion_mult: 0.5
    shared_projection_mult: 0.5
    align_feature_mult: 1.0
    align_patch_mult: 2.0
    align_gate_mult: 0.5
    iqa_head_mult: 5.0
    simsiam_head_mult: 5.0
    other_mult: 1.0
  lambda_img_siam: 0.15
  lambda_img_answer: 0.2
  lambda_img_prompt: 0.25
  lambda_prompt_answer: 0.05
  lambda_prompt_answer_gap: 0.0
  prompt_answer_gap_max_similarity: 0.2
  lambda_quality_reg: 0.2
  lambda_quality_rank: 0.1
  lambda_quality_srocc: 0.0
  quality_rank_margin: 0.05
  quality_srocc_tau: 0.02
  lambda_align_pretrain_reg: 0.2
  lambda_align_pretrain_rank: 0.1
  lambda_align_pretrain_srocc: 0.02
  align_rank_margin: 0.05
  align_srocc_tau: 0.02
  lambda_final_pretrain_reg: 0.0
  lambda_final_pretrain_rank: 0.0
  lambda_final_pretrain_srocc: 0.0
  final_rank_margin: 0.05
  final_srocc_tau: 0.02
  lambda_img_prompt_local: 0.05
  img_prompt_misaligned_max_similarity: 0.1
  misalignment_map_active_threshold: 0.05
  lambda_prompt_answer_word: 0.05
  prompt_answer_misaligned_max_similarity: 0.1
  lambda_quality_neighbor_siam: 0.0
  lambda_quality_order_siam: 0.0
  lambda_quality_triplet_siam: 0.0
  lambda_quality_anchor: 0.0
  lambda_quality_ordinal: 0.0
  lambda_artifact_anchor: 0.01
  lambda_artifact_ordinal: 0.015
  lambda_aesthetics_anchor: 0.01
  lambda_aesthetics_ordinal: 0.015
  lambda_residual_huber: 0.0
  lambda_rank: 0.0
  lambda_pretrain_srocc: 0.0
  pretrain_use_hard_rank: false
  pretrain_selection_metric: val_component_anchor_SROCC
  pretrain_selection_mode: max
  lambda_quality_text_ce: 0.0
optimizer:
  type: adamw
scheduler:
  type: cosine
  min_lr: 1.0e-06
run_id: richhf18k_cliplarge_dualquality_residual_layer3_noce_seed42
