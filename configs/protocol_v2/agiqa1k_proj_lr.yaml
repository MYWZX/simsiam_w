seed: 42
split_seed: 42
results_csv: outputs/agiqa1k_protocolv2_proj_lr_dev_seed42.csv
output_dir: outputs/agiqa1k_protocolv2_proj_lr_dev_seed42
dataset:
  type: agiqa1k_iqa
  root_dir: ./data/AGIQA-1K
  image_dir: file
  csv_file: AIGC-1K_answer.csv
  input_size: 224
  final_quality_weight: 1.0
  final_align_weight: 0.0
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  use_perturb: false
  perturbation_prob: 0.7
  perturbation_strengths: []
  saliency_sampling_ratio: 0.7
  train_augmentation_mode: quality_safe
  quality_safe_flip_prob: 0.0
  mos_normalization: train_minmax
loader:
  batch_size: 8
  num_workers: 4
  pin_memory: true
  isolate_rng: true
model:
  global_encoder:
    type: open_clip
    model_name: ViT-L-14
    open_clip_pretrained: openai
    pretrained: true
    freeze: false
    output_dim: 768
    source_normalization: imagenet
    normalize_output: true
  local_encoder:
    type: resnet50.a1_in1k
    pretrained: true
    freeze: false
    output_dim: 256
    feature_stage: layer3
  fusion:
    embed_dim: 256
    num_heads: 4
    dropout: 0.15
  heads:
    mlp_hidden_dim: 256
    dropout: 0.2
  text_encoder:
    clip_model_name: ViT-L-14
    clip_pretrained: openai
    learnable_context_tokens: 4
  nss_text_gate:
    nss_dim: 6
    gate_hidden_dim: 256
    quality_mix_init: 0.0
  align_gate:
    gate_hidden_dim: 256
  fusion_init_logit: 0.0
  quality_branch_use_text_gate: false
  quality_adapter:
    enabled: true
    hidden_dim: 512
    output_dim: 256
    dropout: 0.1
    last_bn: true
    normalize: true
    mode: residual_feature
    residual_init: 0.1
  align_adapter:
    enabled: true
    adapt_text: true
    hidden_dim: 256
    dropout: 0.1
    residual_scale: 0.1
  align_vmamba:
    enabled: false
  dual_quality_representation:
    enabled: true
    hidden_dim: 256
    dropout: 0.1
    feature_local_init: 0.5
  quality_text_bank:
    enabled: true
    score_blend: 0.0
    temperature: 0.2
    class_context_tokens: 4
    centers:
    - 0.375
    - 0.54166667
    - 0.66666669
    - 0.79166666
    - 0.95833334
  quality_global_feature: g
  align_global_feature: g
  shared_simsiam_projection: true
  simsiam:
    proj_dim: 256
    proj_hidden_dim: 512
  shared_projection_freeze_bn_stats: true
  clip_quick_gelu: true
train:
  epochs: 60
  lr: 0.0001
  weight_decay: 0.002
  amp: true
  grad_clip: 1.0
  log_interval: 20
  early_stop_patience: 60
  pretrained_checkpoint: outputs/richhf18k_protocolv2_shared_seed42/best_component_anchor_pretrain.pth
  pretrained_load_scope: representation
  two_output_only: true
  layerwise_lr:
    enabled: true
    global_encoder_mult: 0.02
    local_encoder_mult: 0.02
    fusion_mult: 0.1
    quality_mult: 1.0
    align_mult: 1.0
    other_mult: 1.0
    shared_projection_mult: 0.1
  quality_only: true
  lambda_quality: 1.0
  lambda_align: 0.0
  lambda_final: 0.0
  lambda_align_aux: 0.0
  lambda_pert: 0.02
  pert_margin: 0.07
  lambda_neg: 0.0
  neg_margin: 0.1
  use_align_rank: false
  lambda_align_rank: 0.0
  align_rank_margin_pos_hard: 0.05
  align_rank_margin_hard_neg: 0.05
  hard_negative_topk: 5
  lambda_rank_quality: 0.03
  lambda_rank_align: 0.0
  lambda_rank_final: 0.0
  rank_margin: 0.02
  lambda_srocc_quality: 0.03
  lambda_srocc_align: 0.0
  lambda_srocc_final: 0.0
  srocc_tau: 0.02
  use_hard_rank: true
  hard_rank_ratio: 0.35
  selection_metric: val_quality_SROCC
  selection_mode: max
  lambda_quality_text_ce: 0.005
  protocol_version: corrected_v2
  record_step_budget: true
  record_run_metadata: true
  audit_loss_gradients: true
optimizer:
  type: adamw
scheduler:
  type: cosine
  min_lr: 1.0e-06
run_id: agiqa1k_protocolv2_proj_lr_dev_seed42
